<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Инструкции 1С:Университет</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Инструкции по работе с 1С:Университет</h1>
      <p class="subtitle">База знаний для пользователей системы</p>
    </div>
  </header>

  <main class="container main-layout">
    <!-- Боковое меню с разделами и подразделами -->
    <aside class="sidebar">
      <nav id="section-nav" aria-label="Разделы инструкций">
        <!-- Список разделов генерируется JavaScript -->
      </nav>
    </aside>

    <!-- Область отображения выбранной инструкции -->
    <section class="content" id="content-area">
      <div class="welcome-message">
        <h2>Добро пожаловать</h2>
        <p>Выберите раздел в меню слева, чтобы просмотреть инструкцию.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Учебный центр. Все инструкции предназначены для внутреннего использования.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
